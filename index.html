<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Whiteboard Pro</title>
<style>
  :root{
    --bg:#f4f5f7;
    --toolbar:#ffffff;
    --card-shadow:0 2px 6px rgba(0,0,0,.12);
    --card-shadow-hi:0 6px 18px rgba(0,0,0,.25);
    --line:#9aa0a6;
    --line-hi:#ff6b00;
    --anchor:#2b7fff;
    --danger:#e53935;
    --success:#2e7d32;
    --warning:#f57c00;
    --dim:.15;
    --radius:10px;
    --sp-width: 400px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#222;background:var(--bg);overflow:hidden}

  .toolbar{
    position:fixed;top:0;left:0;right:0;height:48px;
    background:var(--toolbar);border-bottom:1px solid #e4e6eb;
    display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;
  }
  .toolbar button, .toolbar label{
    font-size:13px;padding:6px 10px;border:1px solid #d0d4da;background:#fff;border-radius:6px;cursor:pointer;
  }
  .toolbar button:hover{background:#f0f2f5}
  .toolbar button:disabled{opacity:.4;cursor:not-allowed}
  .toolbar button.active{background:#2b7fff;color:#fff;border-color:#2b7fff}
  .toolbar .spacer{flex:1}
  .toolbar .color-dot{
    width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aaa;cursor:pointer;display:inline-block
  }
  .toolbar .color-dot.active{box-shadow:0 0 0 2px #222}
  .zoom-group{display:flex;align-items:center;gap:4px;border:1px solid #d0d4da;border-radius:6px;padding:2px;background:#fff}
  .zoom-group button{border:none;padding:4px 8px}
  #zoomLevel{font-size:12px;min-width:48px;text-align:center;color:#444}

  .viewport{
    position:absolute;inset:48px 0 0 0;overflow:hidden;background:var(--bg);
    background-image:radial-gradient(circle, #dfe1e5 1px, transparent 1px);
    background-size:24px 24px;background-position:0 0;
    cursor:grab;transition: right 0.3s ease;
  }
  body.panel-open .viewport { right: var(--sp-width); }
  .viewport.panning{cursor:grabbing}

  .board{
    position:absolute;left:0;top:0;width:8000px;height:6000px;
    transform-origin:0 0;will-change:transform;
  }

  svg.bg-layout{ position:absolute;pointer-events:none;opacity:.85; }
  svg.bg-layout .layout-stroke{ fill:none;stroke:#222;stroke-width:3;vector-effect:non-scaling-stroke; }
  svg.bg-layout .layout-label{ font-family:system-ui,-apple-system,sans-serif; font-size:28px;fill:#222;font-weight:500; }

  svg.links{ position:absolute;left:0;top:0;pointer-events:none;overflow:visible; }
  svg.links path.link{ fill:none;stroke:var(--line);stroke-width:2.2;opacity:.85; pointer-events:none; }
  svg.links path.link.hi{stroke:var(--line-hi);stroke-width:4;opacity:1}

  .card{
    position:absolute;width:130px;min-width:60px;min-height:60px;border-radius:var(--radius);
    background:#fff;box-shadow:var(--card-shadow);display:flex;flex-direction:column;
    outline:2px solid transparent; transition: box-shadow .15s;
  }
  .card.sticky{box-shadow:var(--card-shadow-hi);outline-color:var(--line-hi)}
  .card .title{
    padding:10px;font-weight:600;font-size:14px;border-radius:var(--radius) var(--radius) 0 0;
    cursor:grab;user-select:none;
  }
  .card .details{
    padding:10px;font-size:13px;line-height:1.35;white-space:pre-wrap;word-break:break-word;
    border-top:1px solid rgba(0,0,0,.06);flex:1;
  }
  
  .notes-indicator {
    position: absolute; bottom: 4px; right: 6px; font-size: 14px; opacity: 0.8; pointer-events: none;
  }

  /* SIDE PANEL */
  .side-panel {
    position: fixed; top: 48px; right: 0; bottom: 0; width: var(--sp-width);
    background: #fff; border-left: 1px solid #d0d4da; z-index: 30;
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform 0.3s ease; box-shadow: -4px 0 12px rgba(0,0,0,0.05);
  }
  .side-panel.open { transform: translateX(0); }
  .sp-resize-handle {
    position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
    cursor: ew-resize; z-index: 31;
  }
  .sp-header { padding: 16px; border-bottom: 1px solid #eee; background: #fcfcfc; }
  .sp-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sp-id-tag { font-size: 10px; color: #999; font-family: monospace; }
  .sp-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
  .sp-status { font-size: 11px; color: var(--success); font-weight: 600; }
  
  .sp-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sp-label { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .sp-title-input {
    width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 10px;
    font-size: 16px; font-weight: 600; outline: none;
  }
  .sp-content-editable {
    width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 12px;
    min-height: 80px; font-size: 14px; line-height: 1.5; outline: none; background: #fff;
  }
  .sp-content-editable:focus { border-color: var(--anchor); box-shadow: 0 0 0 2px rgba(43,127,255,0.1); }
  .sp-content-editable:empty::before { content: attr(data-placeholder); color: #aaa; }
  .sp-notes { min-height: 250px; background: #fff9e6; border-color: #f1e4b8; }

  .sync-status{ display:flex;align-items:center;gap:6px;font-size:12px;color:#666;padding:4px 10px;border:1px solid #d0d4da;border-radius:6px;background:#fff; }
  .sync-status .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
  .sync-status.ok .dot{background:var(--success)}
  
  body.sync-blocked { pointer-events: none !important; opacity: 0.7; cursor: wait; }
</style>
</head>
<body>

<div class="toolbar">
  <div id="boardSwitcher">
    <button id="boardName">Whiteboard ▼</button>
  </div>
  <button id="addBtn">+ Karte</button>
  <div class="palette" id="palette"></div>
  <div class="spacer"></div>
  <div class="sync-status" id="syncStatus"><span class="dot"></span> <span id="syncStatusText">Offline</span></div>
  <button id="burgerBtn">☰</button>
</div>

<div class="viewport" id="viewport">
  <div class="board" id="board">
    <svg class="bg-layout" id="bgLayout" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg class="links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div id="sidePanel" class="side-panel">
  <div class="sp-resize-handle" id="spResize"></div>
  <div class="sp-header">
    <div class="sp-header-top">
      <div class="sp-id-tag" id="spId">ID: -</div>
      <button class="sp-close" id="spClose">✕</button>
    </div>
    <div class="sp-status" id="spStatus">Bereit</div>
  </div>
  <div class="sp-body">
    <div class="sp-label">Titel</div>
    <input type="text" class="sp-title-input" id="spTitle" placeholder="Titel...">
    
    <div class="sp-label">Details (auf Kachel sichtbar)</div>
    <div class="sp-content-editable" id="spDetails" contenteditable="true" data-placeholder="Details für die Kachel..."></div>
    
    <div class="sp-label">Notiz (intern)</div>
    <div class="sp-content-editable sp-notes" id="spNotes" contenteditable="true" data-placeholder="Interne, ausführliche Notizen..."></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  try {
    // ========= KONSTANTEN & STATE =========
    const COLORS = [
      {name:'Gelb',bg:'#FFE066'},{name:'Rosa',bg:'#FFADAD'},{name:'Grün',bg:'#B5EAD7'},
      {name:'Blau',bg:'#A0C4FF'},{name:'Lila',bg:'#CDB4DB'},{name:'Orange',bg:'#FFB86B'},
    ];
    const BOARDS_KEY = 'mini_whiteboard_boards_v1';
    const BOARD_PREFIX = 'mini_whiteboard_v15__';
    const SYNC_KEY = 'mini_whiteboard_sync_v2';
    const SP_WIDTH_KEY = 'mini_whiteboard_sp_width';
    
    let boardsIndex = JSON.parse(localStorage.getItem(BOARDS_KEY) || '{"boards":[], "activeId":null}');
    let syncConfig = JSON.parse(localStorage.getItem(SYNC_KEY) || '{"token":null, "enabled":false}');
    let state;
    let activePanelCard = null;

    function defaultState(){
      return { cards:[], links:[], nextId:1, color:COLORS[0].bg, view:{scale:1, tx:0, ty:0}, lastModified:0 };
    }

    // ========= INITIALISIERUNG =========
    if(!boardsIndex.activeId && boardsIndex.boards.length === 0) {
      const id = 'b_' + Date.now().toString(36);
      boardsIndex.boards.push({id, name:'Whiteboard 1', createdAt:Date.now()});
      boardsIndex.activeId = id;
      localStorage.setItem(BOARDS_KEY, JSON.stringify(boardsIndex));
    }

    function loadActiveBoardState(){
      const raw = localStorage.getItem(BOARD_PREFIX + boardsIndex.activeId);
      if(!raw) return defaultState();
      const s = JSON.parse(raw);
      s.cards = s.cards.map(c => Object.assign({details:'', notes:'', autoH:true}, c));
      return Object.assign(defaultState(), s);
    }

    state = loadActiveBoardState();

    // ========= DOM ELEMENTE =========
    const board = document.getElementById('board');
    const palette = document.getElementById('palette');
    const sidePanel = document.getElementById('sidePanel');
    const spTitle = document.getElementById('spTitle');
    const spDetails = document.getElementById('spDetails');
    const spNotes = document.getElementById('spNotes');
    const spId = document.getElementById('spId');

    // Palette rendern (State ist jetzt sicher geladen)
    COLORS.forEach(c => {
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.style.background = c.bg;
      if(state && c.bg === state.color) dot.classList.add('active');
      dot.onclick = () => {
        state.color = c.bg;
        document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
        dot.classList.add('active');
        save();
      };
      palette.appendChild(dot);
    });

    // ========= SIDE PANEL LOGIK =========
    function openPanel(card) {
      // Competition Check
      const x = card.x - ((8000-2488)/2);
      const isCompetition = (x < 1244 && (card.y - (6000-1672)/2) > 500);
      if(isCompetition) return;

      activePanelCard = card;
      spId.textContent = `ID: ${card.id}`;
      spTitle.value = card.title || '';
      spDetails.textContent = card.details || '';
      spNotes.innerHTML = card.notes || '';
      
      document.body.classList.add('panel-open');
      sidePanel.classList.add('open');
    }

    function closePanel() {
      activePanelCard = null;
      document.body.classList.remove('panel-open');
      sidePanel.classList.remove('open');
    }

    document.getElementById('spClose').onclick = closePanel;

    // Side Panel Auto-Save
    [spTitle, spDetails, spNotes].forEach(el => {
      el.oninput = () => {
        if(!activePanelCard) return;
        if(el === spTitle) activePanelCard.title = el.value;
        if(el === spDetails) activePanelCard.details = el.textContent;
        if(el === spNotes) activePanelCard.notes = el.innerHTML;
        
        // Update Card auf dem Board
        const cardEl = document.querySelector(`.card[data-id="${activePanelCard.id}"]`);
        if(cardEl) {
          if(el === spTitle) cardEl.querySelector('.title').textContent = activePanelCard.title;
          if(el === spDetails) cardEl.querySelector('.details').textContent = activePanelCard.details;
          
          // Notiz-Indikator
          let ind = cardEl.querySelector('.notes-indicator');
          const hasNotes = activePanelCard.notes && activePanelCard.notes.replace(/<[^>]*>/g, '').trim().length > 0;
          if(hasNotes && !ind) {
             ind = document.createElement('div'); ind.className = 'notes-indicator'; ind.textContent = '📝';
             cardEl.appendChild(ind);
          } else if(!hasNotes && ind) { ind.remove(); }
        }
        save();
      };
    });

    // Resize Panel
    const resizer = document.getElementById('spResize');
    resizer.onmousedown = (e) => {
      const startX = e.clientX;
      const startWidth = sidePanel.offsetWidth;
      document.onmousemove = (e) => {
        const newWidth = startWidth + (startX - e.clientX);
        if(newWidth > 250 && newWidth < 800) {
          document.documentElement.style.setProperty('--sp-width', newWidth + 'px');
          localStorage.setItem(SP_WIDTH_KEY, newWidth);
        }
      };
      document.onmouseup = () => document.onmousemove = document.onmouseup = null;
    };

    // ========= CORE WHITEBOARD FUNKTIONEN =========
    function renderCard(card) {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = card.id;
      el.style.left = card.x + 'px';
      el.style.top = card.y + 'px';
      
      const title = document.createElement('div');
      title.className = 'title';
      title.style.background = card.color;
      title.textContent = card.title;
      
      const details = document.createElement('div');
      details.className = 'details';
      details.textContent = card.details;

      el.appendChild(title);
      el.appendChild(details);

      if(card.notes && card.notes.replace(/<[^>]*>/g, '').trim().length > 0) {
        const ind = document.createElement('div');
        ind.className = 'notes-indicator';
        ind.textContent = '📝';
        el.appendChild(ind);
      }

      el.onclick = (e) => {
        if(e.target.closest('.title')) return;
        openPanel(card);
      };

      board.appendChild(el);
    }

    function save() {
      state.lastModified = Date.now();
      localStorage.setItem(BOARD_PREFIX + boardsIndex.activeId, JSON.stringify(state));
    }

    function render() {
      board.querySelectorAll('.card').forEach(c => c.remove());
      state.cards.forEach(renderCard);
    }

    // Initialer Render
    render();

    const savedWidth = localStorage.getItem(SP_WIDTH_KEY);
    if(savedWidth) document.documentElement.style.setProperty('--sp-width', savedWidth + 'px');

  } catch (err) {
    console.error('Initialisierungsfehler im Whiteboard:', err);
  }
})();
</script>
</body>
</html>
