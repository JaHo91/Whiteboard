<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Whiteboard Pro Multi-Board</title>
<style>
  :root{
    --bg:#f4f5f7;
    --toolbar:#ffffff;
    --card-shadow:0 2px 6px rgba(0,0,0,.12);
    --card-shadow-hi:0 6px 18px rgba(0,0,0,.25);
    --line:#9aa0a6;
    --line-hi:#ff6b00;
    --anchor:#2b7fff;
    --danger:#e53935;
    --success:#2e7d32;
    --warning:#f57c00;
    --dim:.15;
    --radius:10px;
    --sp-width: 400px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#222;background:var(--bg);overflow:hidden}

  .toolbar{
    position:fixed;top:0;left:0;right:0;height:48px;
    background:var(--toolbar);border-bottom:1px solid #e4e6eb;
    display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;
  }
  .toolbar button, .toolbar label{
    font-size:13px;padding:6px 10px;border:1px solid #d0d4da;background:#fff;border-radius:6px;cursor:pointer;
  }
  .toolbar button:hover{background:#f0f2f5}
  .toolbar button:disabled{opacity:.4;cursor:not-allowed}
  .toolbar button.active{background:#2b7fff;color:#fff;border-color:#2b7fff}
  .toolbar .spacer{flex:1}
  .toolbar .hint{font-size:12px;color:#666}
  .toolbar .color-dot{
    width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aaa;cursor:pointer;display:inline-block
  }
  .toolbar .color-dot.active{box-shadow:0 0 0 2px #222}
  .zoom-group{display:flex;align-items:center;gap:4px;border:1px solid #d0d4da;border-radius:6px;padding:2px;background:#fff}
  .zoom-group button{border:none;padding:4px 8px}
  #zoomLevel{font-size:12px;min-width:48px;text-align:center;color:#444}

  .undo-group{display:flex;align-items:center;gap:4px;border:1px solid #d0d4da;border-radius:6px;padding:2px;background:#fff}
  .undo-group button{border:none;padding:4px 8px;font-size:14px}

  .board-switcher{
    display:flex;align-items:center;gap:4px;border:1px solid #d0d4da;border-radius:6px;background:#fff;
    max-width:260px;
  }
  .board-switcher .board-name{
    padding:6px 10px;font-size:13px;font-weight:500;cursor:pointer;
    max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:6px;
  }
  .board-switcher .board-name:hover{background:#f0f2f5;border-radius:6px 0 0 6px}
  .board-switcher .board-menu-btn{
    padding:6px 8px;border-left:1px solid #d0d4da;cursor:pointer;font-size:12px;
  }
  .board-switcher .board-menu-btn:hover{background:#f0f2f5;border-radius:0 6px 6px 0}

  .sync-status{
    display:flex;align-items:center;gap:6px;font-size:12px;color:#666;
    padding:4px 10px;border:1px solid #d0d4da;border-radius:6px;background:#fff;cursor:pointer;
  }
  .sync-status:hover{background:#f0f2f5}
  .sync-status .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
  .sync-status.ok .dot{background:var(--success)}
  .sync-status.pending .dot{background:var(--warning);animation:pulse 1.5s infinite}
  .sync-status.error .dot{background:var(--danger)}
  .sync-status.syncing .dot{background:var(--anchor);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .burger-btn{
    width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }

  .viewport{
    position:absolute;inset:48px 0 0 0;overflow:hidden;background:var(--bg);
    background-image:radial-gradient(circle, #dfe1e5 1px, transparent 1px);
    background-size:24px 24px;background-position:0 0;
    cursor:grab;
    transition: right 0.3s ease;
  }
  body.panel-open .viewport { right: var(--sp-width); }
  .viewport.panning{cursor:grabbing}

  .board{
    position:absolute;left:0;top:0;width:8000px;height:6000px;
    transform-origin:0 0;will-change:transform;
  }

  svg.bg-layout{
    position:absolute;pointer-events:none;opacity:.85;
  }
  svg.bg-layout .layout-stroke{
    fill:none;stroke:#222;stroke-width:3;vector-effect:non-scaling-stroke;
  }
  svg.bg-layout .layout-label{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:28px;fill:#222;font-weight:500;
  }

  svg.links{
    position:absolute;left:0;top:0;pointer-events:none;overflow:visible;
  }
  svg.links path.link-hit{
    fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke;cursor:pointer;
  }
  svg.links path.link{
    fill:none;stroke:var(--line);stroke-width:2.2;opacity:.85;
    transition:stroke .15s, stroke-width .15s, opacity .15s;
    pointer-events:none;
  }
  svg.links path.link.hi{stroke:var(--line-hi);stroke-width:4;opacity:1}
  svg.links path.link.dim{opacity:var(--dim)}
  svg.links path.ghost{
    fill:none;stroke:var(--anchor);stroke-width:2.5;stroke-dasharray:6 5;pointer-events:none;
  }
  svg.links path.ghost.delete{stroke:var(--danger);stroke-dasharray:4 4}
  svg.links circle.endpoint{
    fill:#fff;stroke:var(--anchor);stroke-width:2;cursor:grab;
    pointer-events:all;r:12;
    transition:r .15s, stroke-width .15s;
  }
  svg.links circle.endpoint:hover{r:14;stroke-width:3}
  svg.links circle.endpoint.dragging{r:12;stroke-width:3;fill:var(--anchor)}

  .card{
    position:absolute;width:130px;min-width:60px;min-height:60px;border-radius:var(--radius);
    background:#fff;box-shadow:var(--card-shadow);display:flex;flex-direction:column;
    transition:box-shadow .15s, opacity .15s, outline-color .15s;
    outline:2px solid transparent;
    --card-font-scale:1;
  }
  .card.hi{box-shadow:var(--card-shadow-hi);outline-color:var(--line-hi)}
  .card.sticky{box-shadow:var(--card-shadow-hi);outline-color:var(--line-hi)}
  .card.dim{opacity:var(--dim)}
  .card.editing{outline-color:var(--anchor);box-shadow:var(--card-shadow-hi);opacity:1 !important}

  .card .title{
    position:relative;padding:10px 32px 10px 10px;font-weight:600;
    font-size:calc(14px * var(--card-font-scale));
    line-height:1.25;
    min-height:calc(40px * var(--card-font-scale));
    cursor:grab;user-select:none;color:#222;outline:none;
    border-radius:var(--radius) var(--radius) 0 0;flex:0 0 auto;
  }
  .card.dragging .title{cursor:grabbing}
  .card .title .title-text{
    display:inline-block;cursor:text;
    padding:1px 3px;border-radius:3px;
    word-break:break-word;
  }
  .card .title.editing{cursor:text;user-select:text}
  .card .title.editing .title-text{
    background:rgba(255,255,255,.35);outline:none;
  }

  .card .details{
    padding:10px;background:#fff;
    font-size:calc(13px * var(--card-font-scale));
    line-height:1.35;
    min-height:calc(40px * var(--card-font-scale));
    outline:none;white-space:pre-wrap;word-break:break-word;
    border-top:1px solid rgba(0,0,0,.06);border-radius:0 0 var(--radius) var(--radius);
    cursor:text;flex:1 1 auto;overflow:hidden;
  }
  .card.autoH .details{overflow:visible}
  .card .details:empty::before{content:attr(data-placeholder);color:#aaa;pointer-events:none}

  .card.image-card{background:#222;overflow:hidden;padding:0}
  .card.image-card .title,
  .card.image-card .details{display:none}
  .card.image-card .image-wrap{
    position:relative;flex:1 1 auto;cursor:grab;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius);overflow:hidden;background:#222;
  }
  .card.image-card.dragging .image-wrap{cursor:grabbing}
  .card.image-card img{
    display:block;width:100%;height:100%;object-fit:contain;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  .card.image-card .img-caption{
    position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(to top, rgba(0,0,0,.65), transparent);
    color:#fff;font-size:12px;padding:6px 8px;pointer-events:none;
    opacity:0;transition:opacity .15s;
  }
  .card.image-card:hover .img-caption,
  .card.image-card.hi .img-caption,
  .card.image-card.sticky .img-caption{opacity:1}

  .card .actions{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .15s;z-index:4}
  .card:hover .actions{opacity:1}
  .card .actions button{width:22px;height:22px;border:none;border-radius:4px;cursor:pointer;background:rgba(255,255,255,.7);font-size:12px;line-height:1}
  .card .actions button:hover{background:#fff}

  .anchor{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:var(--anchor);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);
    opacity:0;transform:translate(-50%,-50%) scale(.7);
    transition:opacity .12s, transform .12s;cursor:crosshair;z-index:5;
  }
  .card:hover .anchor,.card.show-anchors .anchor{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .anchor:hover{transform:translate(-50%,-50%) scale(1.25)}
  .anchor.top{left:50%;top:0}
  .anchor.right{left:100%;top:50%}
  .anchor.bottom{left:50%;top:100%}
  .anchor.left{left:0;top:50%}
  .anchor.active{background:#fff;border-color:var(--anchor);transform:translate(-50%,-50%) scale(1.4)}

  .anchor::after {
    content: '';
    position: absolute;
    top: -16px;
    left: -16px;
    right: -16px;
    bottom: -16px;
    border-radius: 50%;
  }

  .resize-h{position:absolute;z-index:3;opacity:0;transition:opacity .12s}
  .card:hover .resize-h{opacity:1}
  .resize-h.n,.resize-h.s{left:12px;right:12px;height:6px;cursor:ns-resize}
  .resize-h.n{top:-3px}.resize-h.s{bottom:-3px}
  .resize-h.e,.resize-h.w{top:12px;bottom:12px;width:6px;cursor:ew-resize}
  .resize-h.e{right:-3px}.resize-h.w{left:-3px}
  .resize-h.ne,.resize-h.nw,.resize-h.se,.resize-h.sw{
    width:12px;height:12px;background:#fff;border:2px solid var(--anchor);border-radius:3px;
  }
  .resize-h.nw{left:-6px;top:-6px;cursor:nwse-resize}
  .resize-h.ne{right:-6px;top:-6px;cursor:nesw-resize}
  .resize-h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
  .resize-h.se{right:-6px;bottom:-6px;cursor:nwse-resize}

  .card.drop-target{outline-color:var(--anchor);outline-style:dashed}

  .palette{display:flex;gap:6px;align-items:center}
  .legend{font-size:12px;color:#666;margin-right:4px}

  .ctx-menu{
    position:fixed;z-index:100;min-width:220px;
    background:#fff;border:1px solid #d0d4da;border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;font-size:13px;
    max-height:80vh;overflow-y:auto;
  }
  .ctx-menu button{
    display:flex;align-items:center;gap:8px;width:100%;
    background:none;border:none;padding:8px 10px;border-radius:5px;
    text-align:left;cursor:pointer;color:#222;
  }
  .ctx-menu button:hover{background:#f0f2f5}
  .ctx-menu button.danger{color:var(--danger)}
  .ctx-menu button.danger:hover{background:#fdecea}
  .ctx-menu button.current{background:#e3f0ff;font-weight:500}
  .ctx-menu .sep{height:1px;background:#e4e6eb;margin:4px 2px}
  .ctx-menu .head{padding:6px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .ctx-menu .info{padding:6px 10px;color:#666;font-size:11px;line-height:1.4}

  .minimap{
    position:fixed;right:16px;bottom:16px;z-index:15;
    width:220px;height:165px;background:rgba(255,255,255,.92);
    border:1px solid #d0d4da;border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
    overflow:hidden;cursor:crosshair;
  }
  .minimap svg{display:block;width:100%;height:100%}
  .minimap .mm-card{fill-opacity:.85;stroke:rgba(0,0,0,.25);stroke-width:1;vector-effect:non-scaling-stroke}
  .minimap .mm-layout{fill:none;stroke:#222;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.5}
  .minimap .mm-viewport{fill:rgba(43,127,255,.12);stroke:var(--anchor);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .minimap-toggle{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;
    background:rgba(255,255,255,.85);border-radius:4px;cursor:pointer;font-size:12px;line-height:1;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#222;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;
    z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1}
  .toast.error{background:var(--danger)}
  .toast.success{background:var(--success)}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;
    display:flex;align-items:center;justify-content:center;
  }
  .modal{
    background:#fff;border-radius:10px;padding:20px;max-width:520px;width:90%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;
  }
  .modal h2{margin:0 0 12px 0;font-size:18px}
  .modal p{margin:8px 0;font-size:13px;color:#555;line-height:1.5}
  .modal input[type=text],.modal input[type=password]{
    width:100%;padding:8px 10px;border:1px solid #d0d4da;border-radius:6px;
    font-size:13px;font-family:ui-monospace,monospace;margin:4px 0 8px;
  }
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
  .modal button{padding:8px 14px;border:1px solid #d0d4da;border-radius:6px;cursor:pointer;background:#fff;font-size:13px}
  .modal button:hover{background:#f0f2f5}
  .modal button.primary{background:#2b7fff;color:#fff;border-color:#2b7fff}
  .modal button.primary:hover{background:#1f6de0}
  .modal button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .modal button.danger:hover{background:#c62828}
  .modal a{color:var(--anchor);text-decoration:none}
  .modal a:hover{text-decoration:underline}
  .modal code{background:#f0f2f5;padding:2px 5px;border-radius:3px;font-size:12px}
  .modal .small{font-size:11px;color:#888}

  .confirm-warn{
    background:#fff4e5;border:1px solid #ffcc80;color:#6d4200;
    padding:10px 12px;border-radius:6px;font-size:13px;margin:8px 0;
  }

  body.link-selected .card .anchor{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* SIDE PANEL CSS */
  .notes-indicator {
    position: absolute;
    bottom: 4px;
    right: 4px;
    font-size: 14px;
    pointer-events: none;
    opacity: 0.8;
  }

  .side-panel {
    position: fixed;
    top: 48px;
    right: 0;
    bottom: 0;
    width: var(--sp-width);
    background: #fff;
    border-left: 1px solid #d0d4da;
    z-index: 30;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    box-shadow: -4px 0 15px rgba(0,0,0,0.1);
  }

  .side-panel.open {
    transform: translateX(0);
  }

  .sp-resize-handle {
    position: absolute;
    left: -4px;
    top: 0;
    bottom: 0;
    width: 8px;
    cursor: ew-resize;
    z-index: 31;
  }

  .sp-header {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fcfcfc;
  }

  .sp-status {
    font-size: 11px;
    font-weight: 600;
    color: var(--success);
  }

  .sp-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #888;
  }

  .sp-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .sp-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sp-label {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sp-title-input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    font-size: 16px;
    font-weight: 600;
    outline: none;
  }

  .sp-editable {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
    outline: none;
    background: #fff;
    min-height: 40px;
  }

  .sp-editable:empty::before {
    content: attr(data-placeholder);
    color: #aaa;
  }

  .sp-notes {
    min-height: 300px;
    background: #fffdf2;
    border-color: #f1e4b8;
  }

  body.sync-blocked {
    pointer-events: none !important;
    opacity: 0.7;
    cursor: wait;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="board-switcher" id="boardSwitcher" title="Board wechseln">
    <div class="board-name" id="boardName">
      <span id="boardNameText">Whiteboard</span>
      <span style="font-size:10px;color:#888">▼</span>
    </div>
    <div class="board-menu-btn" id="boardMenuBtn" title="Board-Menü">⋮</div>
  </div>
  <button id="addBtn" title="Neue Karte">+ Karte</button>
  <div class="palette" id="palette"><span class="legend">Farbe:</span></div>
  <button id="autoColorBtn" title="Neue Karten bekommen automatisch die Farbe der Zone">🎯 Auto-Farbe</button>
  <div class="undo-group">
    <button id="undoBtn" title="Rückgängig (Strg+Z)">↶</button>
    <button id="redoBtn" title="Wiederherstellen (Strg+Y)">↷</button>
  </div>
  <div class="zoom-group">
    <button id="zoomOutBtn" title="Rauszoomen">−</button>
    <span id="zoomLevel">100%</span>
    <button id="zoomInBtn" title="Reinzoomen">+</button>
    <button id="zoomResetBtn" title="Auf Layout zentrieren">⟲</button>
  </div>
  <div class="spacer"></div>
  <div class="sync-status" id="syncStatus" title="Cloud-Sync Status (klicken für Details)">
    <span class="dot"></span>
    <span id="syncStatusText">Offline</span>
  </div>
  <button class="burger-btn" id="burgerBtn" title="Menü">☰</button>
</div>

<div class="viewport" id="viewport">
  <div class="board" id="board">
    <svg class="bg-layout" id="bgLayout" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg class="links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- SIDE PANEL HTML -->
<div id="sidePanel" class="side-panel">
  <div class="sp-resize-handle" id="spResize"></div>
  <div class="sp-header">
    <div class="sp-status" id="spStatus">Bereit</div>
    <button class="sp-close" id="spClose">✕</button>
  </div>
  <div class="sp-body">
    <div class="sp-group">
      <div class="sp-label">Titel</div>
      <input type="text" class="sp-title-input" id="spTitle" placeholder="Titel...">
    </div>
    <div class="sp-group">
      <div class="sp-label">Details (auf Kachel sichtbar)</div>
      <div class="sp-editable" id="spDetails" contenteditable="true" data-placeholder="Dieser Text erscheint direkt auf der Kachel..."></div>
    </div>
    <div class="sp-group">
      <div class="sp-label">Notiz (intern)</div>
      <div class="sp-editable sp-notes" id="spNotes" contenteditable="true" data-placeholder="Ausführliche interne Notizen hier..."></div>
    </div>
  </div>
</div>

<div class="minimap" id="minimap">
  <svg id="minimapSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
  <button class="minimap-toggle" id="mmToggleBtn" title="Ausblenden">×</button>
</div>

<input id="importInput" type="file" accept="application/json" hidden />
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  try {

  // ========= KONSTANTEN =========
  const COLORS = [
    {name:'Gelb',bg:'#FFE066'},{name:'Rosa',bg:'#FFADAD'},{name:'Grün',bg:'#B5EAD7'},
    {name:'Blau',bg:'#A0C4FF'},{name:'Lila',bg:'#CDB4DB'},{name:'Orange',bg:'#FFB86B'},
  ];

  const BOARDS_KEY = 'mini_whiteboard_boards_v1';
  const BOARD_PREFIX = 'mini_whiteboard_v15__';
  const BACKUP_PREFIX = 'mini_whiteboard_v15_backup__';
  const HISTORY_PREFIX = 'mini_whiteboard_v15_history__';
  const SYNC_KEY = 'mini_whiteboard_sync_v2';
  const SP_WIDTH_KEY = 'mini_whiteboard_sp_width';
  const INDEX_FILENAME = 'whiteboard-index.json';

  const AUTOSAVE_INTERVAL = 3000;
  const HISTORY_INTERVAL = 60000;
  const MAX_HISTORY = 10;
  const SYNC_INTERVAL = 60000;
  const SYNC_DEBOUNCE = 3000;
  const BOARD_W = 8000, BOARD_H = 6000;
  const LAYOUT_W = 2488, LAYOUT_H = 1672;
  const LAYOUT_OFFSET_X = (BOARD_W - LAYOUT_W)/2;
  const LAYOUT_OFFSET_Y = (BOARD_H - LAYOUT_H)/2;
  const CLICK_MOVE_THRESHOLD = 4;
  const CARD_MIN_W = 60, CARD_MIN_H = 60;
  const CARD_MAX_W = 1200, CARD_MAX_H = 900;
  const CARD_DEFAULT_W = 170;
  const CARD_REF_W = 170, CARD_REF_H = 120;
  const IMG_MAX_SIDE = 400;
  const UNDO_LIMIT = 50;
  const BOARD_WARN_LIMIT = 20;

  const LAYOUT = {
    waterY: 500,
    circle: { cx: 1244, cy: 500, r: 414 },
    tri: { apex: {x:1244, y:1540}, left:{x:830, y:500}, right:{x:1658, y:500} },
  };

  const ZONE_COLORS = {
    value_proposition: '#FFE066',
    market_risks:      '#FFADAD',
    competition:       '#CDB4DB',
    customers:         '#B5EAD7',
    influencer:        '#A0C4FF',
    outside:            null,
  };

  // ========= DOM =========
  const viewport = document.getElementById('viewport');
  const board = document.getElementById('board');
  const svg = document.getElementById('links');
  const bgLayout = document.getElementById('bgLayout');
  const addBtn = document.getElementById('addBtn');
  const autoColorBtn = document.getElementById('autoColorBtn');
  const burgerBtn = document.getElementById('burgerBtn');
  const palette = document.getElementById('palette');
  const importInput = document.getElementById('importInput');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomLevel = document.getElementById('zoomLevel');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const minimap = document.getElementById('minimap');
  const minimapSvg = document.getElementById('minimapSvg');
  const mmToggleBtn = document.getElementById('mmToggleBtn');
  const toastEl = document.getElementById('toast');
  const syncStatusEl = document.getElementById('syncStatus');
  const syncStatusText = document.getElementById('syncStatusText');
  const boardSwitcher = document.getElementById('boardSwitcher');
  const boardNameText = document.getElementById('boardNameText');
  const boardNameEl = document.getElementById('boardName');
  const boardMenuBtn = document.getElementById('boardMenuBtn');

  // SIDE PANEL DOM
  const sidePanel = document.getElementById('sidePanel');
  const spTitle = document.getElementById('spTitle');
  const spDetails = document.getElementById('spDetails');
  const spNotes = document.getElementById('spNotes');
  const spStatus = document.getElementById('spStatus');

  bgLayout.setAttribute('width', LAYOUT_W);
  bgLayout.setAttribute('height', LAYOUT_H);
  bgLayout.setAttribute('viewBox', `0 0 ${LAYOUT_W} ${LAYOUT_H}`);
  bgLayout.style.left = LAYOUT_OFFSET_X + 'px';
  bgLayout.style.top  = LAYOUT_OFFSET_Y + 'px';
  bgLayout.innerHTML = `
    <path class="layout-stroke" d="M 830 500 A 414 414 0 0 1 1658 500" />
    <line class="layout-stroke" x1="0" y1="500" x2="${LAYOUT_W}" y2="500" />
    <polyline class="layout-stroke" points="830,500 1244,1540 1658,500" />
    <text class="layout-label" x="1244" y="130"  text-anchor="middle">value proposition</text>
    <text class="layout-label" x="820"  y="485" text-anchor="end">market risks</text>
    <text class="layout-label" x="745"  y="530" text-anchor="middle">competition</text>
    <text class="layout-label" x="1244" y="530" text-anchor="middle">customers</text>
    <text class="layout-label" x="1740" y="530" text-anchor="middle">influencer</text>
  `;
  svg.setAttribute('width', BOARD_W);
  svg.setAttribute('height', BOARD_H);

  function defaultState(){
    return {
      cards:[], links:[], nextId:1, color:COLORS[0].bg,
      showBg:true, showMm:true, view:null, sticky:null,
      autoColor:true, lastModified: 0,
    };
  }

  // ========= MULTI-BOARD REGISTRY =========
  function newBoardId(){
    return 'b_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  function loadBoardsIndex(){
    try{
      const raw = localStorage.getItem(BOARDS_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || !Array.isArray(data.boards)) return null;
      return data;
    }catch{ return null; }
  }
  function saveBoardsIndex(){
    try{
      localStorage.setItem(BOARDS_KEY, JSON.stringify(boardsIndex));
    }catch(err){ console.warn('boards index save failed', err); }
  }

  let boardsIndex = loadBoardsIndex();
  if(!boardsIndex){
    boardsIndex = { boards: [], activeId: null };
    const id = newBoardId();
    const first = { id, name:'Whiteboard 1', gistId:null, publicGistId:null, createdAt:Date.now() };
    boardsIndex.boards.push(first);
    boardsIndex.activeId = id;
    saveBoardsIndex();
  }

  function getActiveBoard(){
    if(!boardsIndex) return null;
    return boardsIndex.boards.find(b => b.id === boardsIndex.activeId) || boardsIndex.boards[0] || null;
  }
  function updateBoardSwitcherUI(){
    const b = getActiveBoard();
    if(!b){ boardNameText.textContent = 'Whiteboard'; return; }
    boardNameText.textContent = b.name;
  }

  // ========= STATE & TIMERS =========
  let state;
  let saveTimer = null;
  let lastBackupAt = 0;
  let lastHistoryAt = 0;
  let syncTimer = null;
  let syncInFlight = false;
  let toastTimer = null;
  let ctxMenuEl = null;
  let modalEl = null;
  let undoStack = [];
  let redoStack = [];
  let suspendSnapshots = false;

  function keyForActive(prefix){
    const b = getActiveBoard();
    return b ? (prefix + b.id) : null;
  }

  function toast(msg, type){
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' '+type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2500);
  }

  function loadSyncConfig(){
    try{ const raw = localStorage.getItem(SYNC_KEY); return raw ? JSON.parse(raw) : null; }
    catch{ return null; }
  }
  function saveSyncConfig(){
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); }catch{}
  }
  let syncConfig = loadSyncConfig() || { token: null, enabled: false, indexGistId: null };
  let boardSyncState = { lastSyncedAt:0, lastSyncedHash:null };

  // ========= LOAD STATE FIRST =========
  function loadActiveBoardState(){
    const key = keyForActive(BOARD_PREFIX);
    if(!key) return defaultState();
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return defaultState();
      const s = JSON.parse(raw);
      // MIGRATION: Notiz-Feld hinzufügen
      if(s.cards) s.cards = s.cards.map(c => Object.assign({details:'', notes:'', autoH:true, image:null, caption:''}, c));
      return Object.assign(defaultState(), s);
    }catch{ return defaultState(); }
  }

  // Initialer State-Load
  state = loadActiveBoardState();

  // ========= UNDO/REDO =========
  function cloneState(){
    const s = serializeState();
    return JSON.parse(JSON.stringify(s));
  }
  function pushUndo(){
    if(suspendSnapshots) return;
    try{
      undoStack.push(cloneState());
      if(undoStack.length > UNDO_LIMIT) undoStack.shift();
      redoStack = [];
      updateUndoButtons();
    }catch(e){ console.warn('undo snapshot failed', e); }
  }
  function updateUndoButtons(){
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }
  function applySnapshot(snap){
    suspendSnapshots = true;
    state = Object.assign(defaultState(), snap);
    state.cards = state.cards.map(c => Object.assign({details:'', notes:'', autoH:true, image:null, caption:''}, c));
    bgLayout.style.display = state.showBg ? '' : 'none';
    minimap.style.display = state.showMm === false ? 'none' : '';
    updateAutoColorButton();
    if(!state.view) fitLayoutToView(); else applyView();
    render();
    saveImmediate();
    suspendSnapshots = false;
  }
  function doUndo(){
    if(!undoStack.length) return;
    redoStack.push(cloneState());
    const snap = undoStack.pop();
    applySnapshot(snap);
    updateUndoButtons();
    toast('Rückgängig');
  }
  function doRedo(){
    if(!redoStack.length) return;
    undoStack.push(cloneState());
    const snap = redoStack.pop();
    applySnapshot(snap);
    updateUndoButtons();
    toast('Wiederhergestellt');
  }
  undoBtn.addEventListener('click', doUndo);
  redoBtn.addEventListener('click', doRedo);

  function saveImmediate(){
    const key = keyForActive(BOARD_PREFIX);
    if(!key) return;
    try{
      const data = serializeState();
      localStorage.setItem(key, JSON.stringify(data));
    }catch(err){ console.warn('save failed', err); }
  }
  function saveDelayed(){
    try{
      const now = Date.now();
      const data = serializeState();
      const json = JSON.stringify(data);
      const backupKey = keyForActive(BACKUP_PREFIX);
      const histKey = keyForActive(HISTORY_PREFIX);
      if(backupKey){ try{ localStorage.setItem(backupKey, json); lastBackupAt = now; }catch{} }
      if(histKey && now - lastHistoryAt > HISTORY_INTERVAL){
        try{
          const rawH = localStorage.getItem(histKey);
          let hist = rawH ? JSON.parse(rawH) : [];
          hist.push({ timestamp: now, data });
          if(hist.length > MAX_HISTORY) hist = hist.slice(-MAX_HISTORY);
          localStorage.setItem(histKey, JSON.stringify(hist));
          lastHistoryAt = now;
        }catch(e){}
      }
    }catch(e){}
  }
  function save(){
    state.lastModified = Date.now();
    saveImmediate();
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDelayed, AUTOSAVE_INTERVAL);
    if(syncConfig.enabled){ scheduleSync(); }
  }
  function serializeState(){
    const serializable = Object.assign({}, state);
    if(state.sticky && state.sticky.type==='link'){
      const idx = state.links.indexOf(state.sticky.link);
      serializable.sticky = idx>=0 ? { type:'link', linkIdx:idx } : null;
    }
    return serializable;
  }

  // ========= ZONENERKENNUNG =========
  function detectZone(pBoard){
    const x = pBoard.x - LAYOUT_OFFSET_X;
    const y = pBoard.y - LAYOUT_OFFSET_Y;
    if(y < LAYOUT.waterY){
      const dx = x - LAYOUT.circle.cx, dy = y - LAYOUT.circle.cy;
      if(dx*dx + dy*dy <= LAYOUT.circle.r * LAYOUT.circle.r) return 'value_proposition';
      return 'market_risks';
    }
    if(pointInTriangle({x,y}, LAYOUT.tri.left, LAYOUT.tri.apex, LAYOUT.tri.right)) return 'customers';
    if(x < LAYOUT.tri.apex.x) return 'competition';
    return 'influencer';
  }
  function pointInTriangle(p,a,b,c){
    const d1=sign(p,a,b), d2=sign(p,b,c), d3=sign(p,c,a);
    const hasNeg=d1<0||d2<0||d3<0, hasPos=d1>0||d2>0||d3>0;
    return !(hasNeg && hasPos);
  }
  function sign(p,a,b){ return (p.x-b.x)*(a.y-b.y)-(a.x-b.x)*(p.y-b.y); }
  function colorForPoint(p){
    if(!state.autoColor) return state.color;
    return ZONE_COLORS[detectZone(p)] || state.color;
  }
  function updateAutoColorButton(){
    autoColorBtn.classList.toggle('active', !!state.autoColor);
  }

  // ========= VIEW =========
  function clampScale(s){ return Math.min(3, Math.max(0.15, s)); }
  function applyView(){
    const {scale,tx,ty} = state.view;
    board.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    viewport.style.backgroundPosition = `${tx}px ${ty}px`;
    viewport.style.backgroundSize = `${24*scale}px ${24*scale}px`;
    zoomLevel.textContent = Math.round(scale*100)+'%';
    renderMinimap();
  }
  function fitLayoutToView(){
    const r = viewport.getBoundingClientRect();
    const margin = 80;
    const availW = Math.max(200, r.width - margin*2);
    const availH = Math.max(200, r.height - margin*2);
    const scale = clampScale(Math.min(availW/LAYOUT_W, availH/LAYOUT_H));
    const cx = LAYOUT_OFFSET_X + LAYOUT_W/2, cy = LAYOUT_OFFSET_Y + LAYOUT_H/2;
    state.view = { scale, tx: r.width/2 - cx*scale, ty: r.height/2 - cy*scale };
    applyView(); save();
  }
  function zoomAt(factor, cx, cy){
    const v = state.view;
    const ns = clampScale(v.scale*factor);
    const k = ns / v.scale;
    v.tx = cx - (cx - v.tx)*k; v.ty = cy - (cy - v.ty)*k;
    v.scale = ns; applyView(); save();
  }

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX-rect.left, e.clientY-rect.top);
  }, {passive:false});
  zoomInBtn.addEventListener('click', ()=>{const r=viewport.getBoundingClientRect(); zoomAt(1.2, r.width/2, r.height/2);});
  zoomOutBtn.addEventListener('click', ()=>{const r=viewport.getBoundingClientRect(); zoomAt(1/1.2, r.width/2, r.height/2);});
  zoomResetBtn.addEventListener('click', fitLayoutToView);

  let lastMouse = { x: null, y: null, over: false };
  viewport.addEventListener('mousemove', (e)=>{ lastMouse.x=e.clientX; lastMouse.y=e.clientY; lastMouse.over=true; });

  // ========= PAN =========
  let panPending=null, pan=null;
  viewport.addEventListener('mousedown', (e)=>{
    hideContextMenu();
    if(e.button !== 0 && e.button !== 1) return;
    if(e.target.closest('.card')) return;
    if(e.target.closest('.link-hit') || e.target.closest('circle.endpoint')) return;
    panPending = { x:e.clientX, y:e.clientY, tx:state.view.tx, ty:state.view.ty };
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e)=>{
    if(panPending && !pan){
      if(Math.abs(e.clientX-panPending.x) > CLICK_MOVE_THRESHOLD || Math.abs(e.clientY-panPending.y) > CLICK_MOVE_THRESHOLD){
        pan = panPending;
        viewport.classList.add('panning');
      }
    }
    if(pan){
      state.view.tx = pan.tx + (e.clientX - pan.x);
      state.view.ty = pan.ty + (e.clientY - pan.y);
      applyView();
    }
  });
  window.addEventListener('mouseup', (e)=>{
    const wasPanning = !!pan;
    if(pan){ pan=null; viewport.classList.remove('panning'); save(); }
    panPending = null;
    if(!wasPanning && !e.target.closest('.card') && !e.target.closest('.toolbar') && !e.target.closest('.side-panel')){
      clearSticky();
    }
  });

  viewport.addEventListener('dblclick', (e) => {
    if(e.target.closest('.card')) return;
    const p = toBoard(e.clientX, e.clientY);
    pushUndo();
    createCard({x:p.x-CARD_DEFAULT_W/2, y:p.y-60, color:colorForPoint(p)});
  });

  function toBoard(clientX, clientY){
    const r = viewport.getBoundingClientRect();
    const {scale,tx,ty} = state.view;
    return { x:(clientX-r.left-tx)/scale, y:(clientY-r.top-ty)/scale };
  }

  // ========= PALETTE =========
  COLORS.forEach(c => {
    const dot = document.createElement('span');
    dot.className = 'color-dot' + (c.bg === state.color ? ' active' : '');
    dot.style.background = c.bg; dot.title = c.name;
    dot.addEventListener('click', () => {
      state.color = c.bg;
      [...palette.querySelectorAll('.color-dot')].forEach(d=>d.classList.remove('active'));
      dot.classList.add('active');
      save();
    });
    palette.appendChild(dot);
  });

  autoColorBtn.addEventListener('click', ()=>{
    pushUndo(); state.autoColor = !state.autoColor;
    updateAutoColorButton(); save();
  });
  addBtn.addEventListener('click', () => {
    const r = viewport.getBoundingClientRect();
    const p = toBoard(r.left + r.width/2, r.top + r.height/2);
    pushUndo(); createCard({x:p.x-CARD_DEFAULT_W/2, y:p.y-60, color:colorForPoint(p)});
  });

  // ========= SIDE PANEL LOGIK =========
  let activePanelCard = null;

  function openPanelForCard(card){
    if(card.image) return; // Bildkarten haben kein Panel
    
    // Competition-Check
    if(detectZone({x: card.x, y: card.y}) === 'competition') return;

    activePanelCard = card;
    spTitle.value = card.title || '';
    spDetails.textContent = card.details || '';
    spNotes.innerHTML = card.notes || '';
    
    document.body.classList.add('panel-open');
    sidePanel.classList.add('open');
    spStatus.textContent = 'Karte #' + card.id + ' wird bearbeitet';
  }

  function closePanel(){
    activePanelCard = null;
    document.body.classList.remove('panel-open');
    sidePanel.classList.remove('open');
  }

  document.getElementById('spClose').onclick = closePanel;

  // Live-Sync: Panel -> Kachel
  [spTitle, spDetails, spNotes].forEach(el => {
    el.addEventListener('input', () => {
      if(!activePanelCard) return;
      if(el === spTitle) activePanelCard.title = spTitle.value;
      if(el === spDetails) activePanelCard.details = spDetails.textContent;
      if(el === spNotes) activePanelCard.notes = spNotes.innerHTML;

      const cardEl = document.querySelector(`.card[data-id="${activePanelCard.id}"]`);
      if(cardEl){
        if(el === spTitle) cardEl.querySelector('.title-text').textContent = activePanelCard.title;
        if(el === spDetails) cardEl.querySelector('.details').textContent = activePanelCard.details;
        
        // Notiz-Icon Update
        const hasNotes = activePanelCard.notes && activePanelCard.notes.replace(/<[^>]*>/g, '').trim().length > 0;
        let ind = cardEl.querySelector('.notes-indicator');
        if(hasNotes && !ind) {
          ind = document.createElement('div'); ind.className = 'notes-indicator'; ind.textContent = '📝';
          cardEl.appendChild(ind);
        } else if(!hasNotes && ind) { ind.remove(); }
      }
      save();
    });
  });

  // Resizer Side Panel
  const resizer = document.getElementById('spResize');
  resizer.onmousedown = (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = sidePanel.offsetWidth;
    document.onmousemove = (me) => {
      const newW = Math.max(250, Math.min(window.innerWidth * 0.7, startW + (startX - me.clientX)));
      document.documentElement.style.setProperty('--sp-width', newW + 'px');
      localStorage.setItem(SP_WIDTH_KEY, newW);
    };
    document.onmouseup = () => { document.onmousemove = document.onmouseup = null; };
  };

  // ========= CARDS =========
  function createCard(c){
    const card = Object.assign({ id: state.nextId++, details:'', notes:'', autoH:true, image:null, caption:'' }, c);
    state.cards.push(card); renderCard(card);
    updateLinks(); renderMinimap(); save();
    return card;
  }
  function deleteCard(id){
    state.cards = state.cards.filter(c=>c.id!==id);
    state.links = state.links.filter(l=>l.a!==id && l.b!==id);
    render(); save();
  }

  function renderCard(card){
    const el = document.createElement('div');
    el.className = 'card' + (card.image ? ' image-card' : '');
    el.dataset.id = card.id;
    el.style.left = card.x+'px'; el.style.top = card.y+'px';
    if(card.w) el.style.width = card.w+'px';

    if(card.image){
      el.style.height = (card.h || 200) + 'px';
      const wrap = document.createElement('div');
      wrap.className = 'image-wrap';
      const img = document.createElement('img'); img.src = card.image;
      wrap.appendChild(img);
      wrap.addEventListener('mousedown', (e)=>onCardDragStart(e, el, card));
      el.appendChild(wrap);
    } else {
      if(card.autoH){ el.classList.add('autoH'); el.style.height = 'auto'; }
      const title = document.createElement('div');
      title.className = 'title'; title.style.background = card.color;
      const titleText = document.createElement('span');
      titleText.className = 'title-text'; titleText.textContent = card.title;
      title.appendChild(titleText);

      const details = document.createElement('div');
      details.className = 'details'; details.textContent = card.details;
      
      title.addEventListener('mousedown', (e)=>onCardDragStart(e, el, card));
      
      // Notiz-Indikator
      if(card.notes && card.notes.replace(/<[^>]*>/g, '').trim().length > 0) {
        const ind = document.createElement('div');
        ind.className = 'notes-indicator'; ind.textContent = '📝';
        el.appendChild(ind);
      }

      el.appendChild(title);
      el.appendChild(details);
    }

    el.onclick = (e) => {
      if(e.target.closest('.actions') || e.target.closest('.resize-h') || e.target.closest('.anchor')) return;
      openPanelForCard(card);
      setStickyCard(card.id);
    };

    const actions = document.createElement('div');
    actions.className = 'actions';
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕'; delBtn.onclick = (e)=>{ e.stopPropagation(); deleteCard(card.id); };
    actions.appendChild(delBtn);
    el.appendChild(actions);

    ['top','right','bottom','left'].forEach(side=>{
      const a = document.createElement('div');
      a.className = 'anchor '+side;
      a.addEventListener('mousedown', (e)=>onAnchorDragStart(e, card, side, a));
      el.appendChild(a);
    });

    ['n','s','e','w','ne','nw','se','sw'].forEach(dir=>{
      const h = document.createElement('div');
      h.className = 'resize-h '+dir;
      h.addEventListener('mousedown', (e)=>onResizeStart(e, card, el, dir));
      el.appendChild(h);
    });

    board.appendChild(el);
  }

  // ========= CARD DRAG & RESIZE =========
  let cardDrag = null;
  function onCardDragStart(e, cardEl, card){
    if(e.button!==0) return;
    const start = toBoard(e.clientX, e.clientY);
    cardDrag = { card, cardEl, offX:start.x-card.x, offY:start.y-card.y, moved:false };
    e.preventDefault(); e.stopPropagation();
  }
  window.addEventListener('mousemove', (e)=>{
    if(!cardDrag) return;
    cardDrag.moved = true;
    const p = toBoard(e.clientX, e.clientY);
    cardDrag.card.x = p.x - cardDrag.offX;
    cardDrag.card.y = p.y - cardDrag.offY;
    cardDrag.cardEl.style.left = cardDrag.card.x+'px';
    cardDrag.cardEl.style.top  = cardDrag.card.y+'px';
    updateLinks(); renderMinimap();
  });
  window.addEventListener('mouseup', ()=>{ if(cardDrag){ if(cardDrag.moved) save(); cardDrag=null; } });

  let resizeDrag = null;
  function onResizeStart(e, card, cardEl, dir){
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    pushUndo(); card.autoH = false;
    resizeDrag = { card, cardEl, dir, startW: cardEl.offsetWidth, startH: cardEl.offsetHeight, startX: card.x, startY: card.y, sx: e.clientX, sy: e.clientY };
  }
  window.addEventListener('mousemove', (e)=>{
    if(!resizeDrag) return;
    const dx = (e.clientX - resizeDrag.sx)/state.view.scale;
    const dy = (e.clientY - resizeDrag.sy)/state.view.scale;
    if(resizeDrag.dir.includes('e')) resizeDrag.card.w = resizeDrag.startW + dx;
    if(resizeDrag.dir.includes('s')) resizeDrag.card.h = resizeDrag.startH + dy;
    resizeDrag.cardEl.style.width = resizeDrag.card.w + 'px';
    resizeDrag.cardEl.style.height = resizeDrag.card.h + 'px';
    updateLinks(); renderMinimap();
  });
  window.addEventListener('mouseup', ()=>{ if(resizeDrag){ resizeDrag=null; save(); } });

  // ========= ANCHORS & LINKS =========
  let connectDrag = null, ghostPath = null;
  function onAnchorDragStart(e, card, side, anchorEl){
    if(e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    connectDrag = { fromId: card.id, fromSide: side };
    ghostPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    ghostPath.setAttribute('class','ghost');
    svg.appendChild(ghostPath);
  }
  window.addEventListener('mousemove', (e)=>{
    if(!connectDrag) return;
    const from = state.cards.find(c=>c.id===connectDrag.fromId);
    const pA = sideAnchorPoint(from, connectDrag.fromSide);
    const pB = toBoard(e.clientX, e.clientY);
    ghostPath.setAttribute('d', `M ${pA.x} ${pA.y} L ${pB.x} ${pB.y}`);
  });
  window.addEventListener('mouseup', (e)=>{
    if(!connectDrag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cardEl = el && el.closest('.card');
    if(cardEl){
      const toId = +cardEl.dataset.id;
      if(toId !== connectDrag.fromId){
        pushUndo(); state.links.push({a:connectDrag.fromId, b:toId, sideA:connectDrag.fromSide});
        updateLinks(); save();
      }
    }
    ghostPath.remove(); connectDrag = null;
  });

  function sideAnchorPoint(card, side){
    const el = document.querySelector(`.card[data-id="${card.id}"]`);
    const w = el ? el.offsetWidth : 170, h = el ? el.offsetHeight : 120;
    if(side==='top') return {x:card.x+w/2, y:card.y};
    if(side==='right') return {x:card.x+w, y:card.y+h/2};
    if(side==='bottom') return {x:card.x+w/2, y:card.y+h};
    return {x:card.x, y:card.y+h/2};
  }

  function updateLinks(){
    [...svg.querySelectorAll('path.link')].forEach(n=>n.remove());
    state.links.forEach(l=>{
      const a = state.cards.find(c=>c.id===l.a), b = state.cards.find(c=>c.id===l.b);
      if(!a || !b) return;
      const pA = sideAnchorPoint(a, l.sideA || 'right'), pB = sideAnchorPoint(b, l.sideB || 'left');
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','link'); p.setAttribute('d', `M ${pA.x} ${pA.y} L ${pB.x} ${pB.y}`);
      svg.appendChild(p);
    });
  }

  // ========= UI HELPERS =========
  function setStickyCard(id){
    state.sticky = {type:'card', id};
    document.querySelectorAll('.card').forEach(el=>el.classList.toggle('sticky', +el.dataset.id===id));
  }
  function clearSticky(){
    state.sticky = null; closePanel();
    document.querySelectorAll('.card').forEach(el=>el.classList.remove('sticky'));
  }

  function hideContextMenu(){ if(ctxMenuEl){ ctxMenuEl.remove(); ctxMenuEl=null; } }

  function renderMinimap(){
    if(!state.showMm) return;
    let html = '';
    state.cards.forEach(c => {
      html += `<rect x="${c.x}" y="${c.y}" width="${c.w||170}" height="${c.h||120}" fill="${c.color}" opacity="0.6"/>`;
    });
    minimapSvg.innerHTML = html;
  }

  function render(){
    board.querySelectorAll('.card').forEach(n=>n.remove());
    state.cards.forEach(renderCard);
    updateLinks(); renderMinimap();
    bgLayout.style.display = state.showBg ? '' : 'none';
    minimap.style.display = state.showMm ? '' : 'none';
    updateBoardSwitcherUI();
  }

  // ========= SYNC LOGIC (Stark vereinfacht für Struktur) =========
  async function githubRequest(path, method, body){
    if(!syncConfig.token) return;
    return fetch('https://api.github.com'+path, {
      method, headers: { 'Authorization':'Bearer '+syncConfig.token, 'Content-Type':'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(r=>r.json());
  }
  function scheduleSync(){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(async ()=>{
      if(!getActiveBoard().gistId) return;
      setSyncStatus('syncing', 'Sende...');
      await githubRequest('/gists/'+getActiveBoard().gistId, 'PATCH', { files: { 'whiteboard.json': { content: JSON.stringify(state) } } });
      setSyncStatus('ok', 'Synchronisiert');
    }, SYNC_DEBOUNCE);
  }
  function setSyncStatus(kind, text){
    syncStatusEl.className = 'sync-status ' + kind;
    syncStatusText.textContent = text;
  }

  // ========= INIT =========
  if(!state.view) fitLayoutToView(); else applyView();
  const savedWidth = localStorage.getItem(SP_WIDTH_KEY);
  if(savedWidth) document.documentElement.style.setProperty('--sp-width', savedWidth + 'px');
  render();

  } catch (err) {
    console.error('Initialisierungsfehler im Whiteboard:', err);
  }
})();
</script>
</body>
</html>
